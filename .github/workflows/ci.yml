name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: anilya_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: localdev
      PGDATABASE: anilya_erp
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (every workspace)
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run tests (every workspace)
        run: npm run test

      - name: Build (every workspace)
        run: npm run build

      - name: Dependency vulnerability scan
        run: npm run audit

      - name: Secret scan
        run: npm run secrets:scan

      - name: Generate SBOM
        run: npm run sbom

      - name: Upload SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
